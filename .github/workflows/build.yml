name: Compilar StickerSound

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: unzip -o StickerSound_Android.zip

      - name: Compilar APK
        working-directory: StickerSound
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: StickerSound-APK
          path: StickerSound/app/build/outputs/apk/debug/*.apk
